<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Neo UI — Login</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--s1:#161b22;--s2:#21262d;--s3:#2d333b;
  --bd:#30363d;--bd2:#444c56;
  --tx:#e6edf3;--tx2:#adbac7;--mu:#768390;
  --ac:#58a6ff;--ac2:#79c0ff;
  --gr:#3fb950;--rd:#f85149;--pu:#bc8cff;--ye:#d29922;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(88,166,255,.12),transparent);pointer-events:none}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(88,166,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(88,166,255,.03) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}

.wrap{position:relative;z-index:1;width:100%;max-width:400px;padding:0 20px}

.logo-area{text-align:center;margin-bottom:28px}
.logo-box{display:inline-flex;width:60px;height:60px;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--s2) 0%,var(--s3) 100%);border:1px solid var(--bd);border-radius:16px;font-size:28px;margin-bottom:14px;box-shadow:0 0 40px rgba(88,166,255,.15),inset 0 1px 0 rgba(255,255,255,.05)}
.logo-name{font-size:26px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,var(--tx) 0%,var(--tx2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-ver{display:inline-block;margin-top:4px;font-size:11px;color:var(--mu);background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;letter-spacing:.4px}
.logo-sub{font-size:13px;color:var(--mu);margin-top:8px}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

.ae{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);border-radius:8px;padding:10px 13px;font-size:13px;color:var(--rd);margin-bottom:16px;display:flex;gap:7px;align-items:center}

.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin-bottom:10px}

.btn-auth{display:flex;align-items:center;gap:11px;width:100%;padding:11px 15px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .12s;margin-bottom:8px;position:relative}
.btn-auth:hover{background:var(--s3);border-color:var(--bd2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn-auth:active{transform:translateY(0)}
.btn-auth svg{width:19px;height:19px;flex-shrink:0}
.btn-auth span{flex:1}
.btn-auth small{font-size:11px;color:var(--mu)}

.btn-discord{border-color:rgba(88,101,242,.35);background:rgba(88,101,242,.07)}
.btn-discord:hover{background:rgba(88,101,242,.14);border-color:rgba(88,101,242,.55)}
.btn-github{border-color:rgba(240,246,252,.12)}
.btn-github:hover{border-color:rgba(240,246,252,.25)}
.btn-google{border-color:rgba(66,133,244,.25);background:rgba(66,133,244,.05)}
.btn-google:hover{background:rgba(66,133,244,.1);border-color:rgba(66,133,244,.4)}

.feats{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd)}
.feat{display:inline-flex;align-items:center;gap:5px;background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:3px 9px;font-size:11.5px;color:var(--tx2)}
.fdot{width:6px;height:6px;border-radius:50%}

.foot{text-align:center;margin-top:14px;font-size:12px;color:var(--mu)}
.foot a{color:var(--ac);text-decoration:none}
.foot a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <div class="logo-box">🤖</div>
    <div class="logo-name">Open Neo UI</div>
    <div><span class="logo-ver">v0.2.1 Alpha 2</span></div>
    <div class="logo-sub">Proxy local de IA · Ollama · DeepSeek · OpenAI · Claude · Gemini</div>
  </div>

  <div class="card">
    {{ERR}}
    <div class="section-label">Entrar com</div>

    <a href="/auth/discord" class="btn-auth btn-discord">
      <svg viewBox="0 0 24 24" fill="#5865f2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.045.036.057a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      <span>Discord</span>
    </a>

    <a href="/auth/github" class="btn-auth btn-github">
      <svg viewBox="0 0 24 24" fill="#e6edf3"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      <span>GitHub</span>
    </a>

    <a href="/auth/google" class="btn-auth btn-google">
      <svg viewBox="0 0 24 24"><path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span>Google</span>
    </a>

    <div class="feats">
      <span class="feat"><span class="fdot" style="background:var(--gr)"></span>Ollama local</span>
      <span class="feat"><span class="fdot" style="background:var(--ac)"></span>DeepSeek</span>
      <span class="feat"><span class="fdot" style="background:var(--tx2)"></span>OpenAI</span>
      <span class="feat"><span class="fdot" style="background:var(--pu)"></span>Claude</span>
      <span class="feat"><span class="fdot" style="background:var(--ye)"></span>Gemini</span>
    </div>
  </div>

  <div class="foot">
    Roda localmente · Dados 100% seus · Licença ISC ·
    <a href="https://github.com" target="_blank">GitHub</a>
  </div>
</div>
</body>
</html>
