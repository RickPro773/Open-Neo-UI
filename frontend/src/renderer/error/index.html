<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Erro de conexão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: #08080a; color: #9898b0;
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    .box { text-align: center; max-width: 360px; padding: 32px; }
    .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
    h2 { color: #e8e8f0; font-size: 16px; margin-bottom: 8px; font-weight: 600; }
    p  { font-size: 13px; line-height: 1.6; color: #5a5a72; }
    .hint { margin-top: 20px; font-size: 12px; padding: 10px 14px; background: #14141a; border-radius: 8px; border: 1px solid rgba(255,255,255,0.07); text-align: left; }
    .hint code { color: #7b6cf6; font-family: monospace; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⚡</div>
    <h2>Serviço não encontrado</h2>
    <p>Não foi possível conectar ao endereço solicitado.</p>
    <div class="hint">
      Verifique se o backend está rodando:<br/>
      <code>docker compose up -d</code>
    </div>
  </div>
</body>
</html>
