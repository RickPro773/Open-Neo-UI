<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"/>
  <title>Neo UI</title>
  <!-- FIX: era shell.css mas o arquivo está na mesma pasta agora -->
  <link rel="stylesheet" href="shell.css"/>
</head>
<body>

<!-- ═══════════════════════════════════════════
     SIDEBAR
═══════════════════════════════════════════ -->
<aside id="sidebar">
  <div class="sidebar-top">

    <div id="logo-mark" title="Neo UI v0.3.1">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="16,4 28,26 4,26" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
        <circle cx="16" cy="4"  r="2" fill="currentColor"/>
        <circle cx="28" cy="26" r="2" fill="currentColor"/>
        <circle cx="4"  cy="26" r="2" fill="currentColor"/>
        <circle cx="16" cy="17" r="3" fill="currentColor" opacity="0.6"/>
      </svg>
    </div>

    <div class="sidebar-divider"></div>

    <button class="sb-btn" id="sb-chat"     data-url="http://localhost:3000"       data-title="Chat IA"         data-icon="chat"    title="Chat IA">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>

    <button class="sb-btn" id="sb-terminal"  title="Terminal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    </button>

    <button class="sb-btn" id="sb-mcp"      data-url="http://localhost:8000/docs"  data-title="MCP Tools"       data-icon="tools"   title="MCP Tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </button>

    <button class="sb-btn" id="sb-gateway"  data-url="http://localhost:8080/health" data-title="Gateway Rust"   data-icon="shield"  title="Gateway Rust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </button>

    <button class="sb-btn" id="sb-go"       data-url="http://localhost:9090/health" data-title="Orquestrador"   data-icon="bolt"    title="Go Orchestrator">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </button>

    <button class="sb-btn" id="sb-python"   data-url="http://localhost:8000/docs"  data-title="Python MCP"      data-icon="python"  title="Python FastAPI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </button>

    <button class="sb-btn" id="sb-status" title="Status dos serviços">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span id="status-dot" class="status-dot"></span>
    </button>

  </div>

  <div class="sidebar-bottom">
    <button class="sb-btn" id="sb-sidebar-toggle" title="Recolher sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</aside>

<!-- ═══════════════════════════════════════════
     ÁREA PRINCIPAL
═══════════════════════════════════════════ -->
<div id="main-area">

  <!-- TITLEBAR -->
  <div id="titlebar">
    <div id="drag-region">
      <span id="app-label">Neo UI <span class="ver">v0.3.1</span></span>
    </div>
    <div id="win-controls">
      <button id="btn-min"   title="Minimizar">
        <svg viewBox="0 0 10 10" fill="currentColor"><rect x="0" y="4.5" width="10" height="1"/></svg>
      </button>
      <button id="btn-max"   title="Maximizar">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
      </button>
      <button id="btn-close" title="Fechar">
        <svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2"><line x1="0" y1="0" x2="10" y2="10"/><line x1="10" y1="0" x2="0" y2="10"/></svg>
      </button>
    </div>
  </div>

  <!-- TAB BAR -->
  <div id="tabbar">
    <div id="tabs-scroll">
      <!-- FIX: era tabs-container no renderer mas tabs-list no HTML — padronizado para tabs-list -->
      <div id="tabs-list"></div>
    </div>
    <div id="tab-extras">
      <button id="btn-new-tab" title="Nova aba (Ctrl+T)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
      </button>
    </div>
  </div>

  <!-- NAVBAR -->
  <div id="navbar">
    <div id="nav-left">
      <button class="nav-btn" id="nav-back"    title="Voltar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="10,2 4,8 10,14"/></svg>
      </button>
      <button class="nav-btn" id="nav-forward" title="Avançar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="6,2 12,8 6,14"/></svg>
      </button>
      <button class="nav-btn" id="nav-reload"  title="Recarregar (Ctrl+R)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 2.5A7 7 0 1 1 6.5 2H10"/><polyline points="10,0 10,4 14,4"/></svg>
      </button>
    </div>

    <div id="url-bar-wrap">
      <span id="url-icon">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="3" ry="6.5"/><line x1="1.5" y1="8" x2="14.5" y2="8"/></svg>
      </span>
      <input id="url-bar" type="text" placeholder="URL ou comando…" spellcheck="false" autocomplete="off"/>
    </div>

    <div id="nav-right">
      <button class="nav-btn" id="nav-devtools" title="DevTools (F12)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><polyline points="4,5 1,8 4,11"/><polyline points="12,5 15,8 12,11"/><line x1="9" y1="3" x2="7" y2="13"/></svg>
      </button>
    </div>
  </div>

  <!-- STATUS PANEL -->
  <div id="status-panel" class="hidden">
    <div id="status-header">
      <span>Serviços</span>
      <button id="status-close">
        <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.4"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>
      </button>
    </div>
    <div id="services-list"></div>
    <div id="status-footer">
      <div id="mem-bar-wrap">
        <span id="mem-label">RAM</span>
        <div id="mem-bar"><div id="mem-fill"></div></div>
        <span id="mem-pct">—</span>
      </div>
    </div>
  </div>

</div><!-- /main-area -->

<!-- FIX: era shell.js (não existia) - agora corresponde ao output do tsc de shell.ts -->
<script src="../../../dist/renderer/shell/shell.js"></script>
</body>
</html>
