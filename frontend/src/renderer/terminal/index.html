<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self';"/>
  <title>Terminal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }

    #term-toolbar {
      height: 34px;
      background: #0f0f12;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      flex-shrink: 0;
    }
    #term-toolbar span {
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 11px;
      color: #5a5a72;
      flex: 1;
    }
    .tb-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      color: #5a5a72;
      cursor: pointer;
      padding: 3px 8px;
      font-size: 11px;
      font-family: inherit;
      transition: background 0.12s, color 0.12s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tb-btn:hover { background: #1c1c24; color: #e8e8f0; }
    .tb-btn svg   { width: 12px; height: 12px; }

    #term-wrap {
      position: absolute;
      top: 34px; left: 0; right: 0; bottom: 0;
      padding: 6px;
    }
    #terminal { width: 100%; height: 100%; }

    /* xterm overrides */
    .xterm-viewport { background: transparent !important; }
  </style>
  <!-- xterm.js via CDN (deve funcionar com CSP self + file; em prod usa dist local) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"/>
</head>
<body>

<div id="term-toolbar">
  <svg viewBox="0 0 16 16" fill="none" stroke="#7b6cf6" stroke-width="1.5" width="14" height="14">
    <polyline points="3,11 7,8 3,5"/>
    <line x1="8" y1="11" x2="13" y2="11"/>
  </svg>
  <span id="shell-label">Terminal</span>
  <button class="tb-btn" id="btn-clear" title="Limpar">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13l5-10 5 10"/><line x1="4" y1="10" x2="12" y2="10"/></svg>
    Limpar
  </button>
  <button class="tb-btn" id="btn-new-shell" title="Novo shell">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
    Novo
  </button>
</div>

<div id="term-wrap">
  <div id="terminal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
<script>
(async () => {
  // Verifica se API neo está disponível (preload carregado)
  if (!window.neo) {
    document.getElementById("terminal").textContent = "Erro: preload não carregado.";
    return;
  }

  const { Terminal }    = window.Terminal   ?? window;
  const { FitAddon }    = window.FitAddon   ?? {};
  const { WebLinksAddon } = window.WebLinksAddon ?? {};

  const term = new Terminal({
    theme: {
      background:  "#0a0a0c",
      foreground:  "#e8e8f0",
      cursor:      "#7b6cf6",
      cursorAccent:"#0a0a0c",
      selectionBackground: "rgba(123,108,246,0.3)",
      black:   "#1c1c24", brightBlack:   "#5a5a72",
      red:     "#f55",    brightRed:     "#ff7070",
      green:   "#3ecfb0", brightGreen:   "#5fdfcb",
      yellow:  "#f9a825", brightYellow:  "#ffc107",
      blue:    "#7b6cf6", brightBlue:    "#a599ff",
      magenta: "#c678dd", brightMagenta: "#d898f0",
      cyan:    "#56b6c2", brightCyan:    "#6fcfda",
      white:   "#e8e8f0", brightWhite:   "#ffffff",
    },
    fontFamily: '"Cascadia Code", "Fira Code", "JetBrains Mono", monospace',
    fontSize: 13,
    lineHeight: 1.35,
    cursorBlink: true,
    cursorStyle: "bar",
    scrollback: 5000,
    allowProposedApi: true,
  });

  const fitAddon = FitAddon ? new FitAddon() : null;
  if (fitAddon) term.loadAddon(fitAddon);
  if (WebLinksAddon) term.loadAddon(new WebLinksAddon());

  term.open(document.getElementById("terminal"));
  if (fitAddon) fitAddon.fit();

  // Criar PTY via IPC
  const { id, shell } = await window.neo.terminal.create({
    cols: term.cols,
    rows: term.rows,
  });

  document.getElementById("shell-label").textContent = `Terminal — ${shell}`;

  // Dados do PTY → xterm
  window.neo.on("terminal:data", ({ id: sid, data }) => {
    if (sid === id) term.write(data);
  });

  window.neo.on("terminal:exit", ({ id: sid, exitCode }) => {
    if (sid === id) {
      term.writeln(`\r\n\x1b[33m[processo encerrado com código ${exitCode}]\x1b[0m`);
    }
  });

  // Teclado → PTY
  term.onData((data) => window.neo.terminal.write(id, data));

  // Resize
  const ro = new ResizeObserver(() => {
    if (fitAddon) {
      fitAddon.fit();
      window.neo.terminal.resize(id, term.cols, term.rows);
    }
  });
  ro.observe(document.getElementById("term-wrap"));

  // Toolbar
  document.getElementById("btn-clear").addEventListener("click", () => term.clear());
  document.getElementById("btn-new-shell").addEventListener("click", async () => {
    window.neo.terminal.kill(id);
    const res = await window.neo.terminal.create({ cols: term.cols, rows: term.rows });
    term.clear();
    term.writeln(`\x1b[90m[novo shell: ${res.shell}]\x1b[0m`);
  });

  term.writeln("\x1b[90mNeo UI Terminal — PTY real via node-pty\x1b[0m");
  term.writeln("\x1b[90mDigite comandos. A IA pode executar aqui via MCP.\x1b[0m\r\n");
})();
</script>
</body>
</html>
